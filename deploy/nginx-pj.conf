# nginx — /etc/nginx/sites-available/pj  (link em sites-enabled)
# Certbot: sudo certbot --nginx -d pj.camim.com.br
server {
    server_name pj.camim.com.br;
    listen 80;

    client_max_body_size 20m;

    # NUNCA servir /media direto — boletos e contratos só saem pela
    # view autenticada do Django (/arquivo/...).
    location /media/        { return 404; }
    location /media-interno/ { return 404; }

    location /static/ {
        alias /opt/pj/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8022;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
