{% extends 'base.html' %}
{% block title %}Entrar · Camim PJs{% endblock %}
{% block conteudo %}
<div class="card" style="max-width:430px;margin:28px auto">
  <h1>Entrar</h1>
  <p class="sub">Portal de prestadores da Camim</p>
  {% if erro %}<div class="msg error">{{ erro }}</div>{% endif %}
  <form method="post" action="{% url 'entrar' %}">
    {% csrf_token %}
    <label>E-mail</label>
    <input name="email" type="email" required autofocus value="{{ email }}"
           autocomplete="username"
           style="width:100%;padding:12px;border:1px solid var(--linha);border-radius:10px;font-size:1rem">
    <label>Senha</label>
    <input name="senha" type="password" required autocomplete="current-password"
           style="width:100%;padding:12px;border:1px solid var(--linha);border-radius:10px;font-size:1rem">
    <button class="btn" style="width:100%;margin-top:20px">Entrar</button>
  </form>
  <p style="margin-top:14px;text-align:center">
    <a href="{% url 'recuperar_senha' %}">Esqueci minha senha / primeiro acesso</a></p>
  <hr style="border:0;border-top:1px solid var(--linha);margin:22px 0">
  <p class="sub" style="text-align:center;margin-bottom:10px">É da equipe Camim?</p>
  <a class="btn claro" style="width:100%;text-align:center"
     href="{% url 'oidc_authentication_init' %}">Entrar com IDCamim</a>
</div>
{% endblock %}
